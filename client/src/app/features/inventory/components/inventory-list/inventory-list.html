<mat-toolbar class="table-toolbar">
  <button mat-flat-button color="primary" (click)="create()">
    <mat-icon>visibility</mat-icon>
    {{'buttons.items'| translate}}
  </button>

  <button mat-flat-button color="primary" (click)="create()">
    <mat-icon>add</mat-icon>
    {{'buttons.create'| translate}}
  </button>

  <button mat-flat-button (click)="edit()">
    <mat-icon>edit</mat-icon>
    {{'buttons.edit'| translate}}
  </button>

  <button mat-flat-button color="warn" (click)="delete()">
    <mat-icon>delete</mat-icon>
    {{'buttons.delete'| translate}}
  </button>
</mat-toolbar>

<table mat-table [dataSource]="dataSource()" class="mat-elevation-z1">
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox (change)="toggleAllRows()" [checked]="isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox (click)="$event.stopPropagation()" (change)="selection.toggle(row)"
        [checked]="selection.isSelected(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="customId">
    <th mat-header-cell *matHeaderCellDef> {{'search.customId' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.idFormat }} </td>
  </ng-container>

  <ng-container matColumnDef="inventory">
    <th mat-header-cell *matHeaderCellDef> {{'search.inventory' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.title }} </td>
  </ng-container>

  <ng-container matColumnDef="description">
    <th mat-header-cell *matHeaderCellDef> {{'search.description' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.description }} </td>
  </ng-container>

  <ng-container matColumnDef="category">
    <th mat-header-cell *matHeaderCellDef> {{'search.category' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.category?.name }} </td>
  </ng-container>
  
  <ng-container matColumnDef="author">
    <th mat-header-cell *matHeaderCellDef> {{'search.author' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.author?.name }} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
