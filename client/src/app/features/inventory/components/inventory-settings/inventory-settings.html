<div class="details-wrapper">
  @if(inventory()?.imageUrl) {
    <img [src]="inventory()?.imageUrl" alt="{{inventory()?.title}}" width="350" height="350"
      style="object-fit: cover; border-radius: 4px;">
  }
  <div >
    <p><strong>{{'inventory.title'| translate}}:</strong> {{inventory()?.title}}</p>
    <p><strong>{{'inventory.date'| translate}}:</strong> {{inventory()?.updatedAt | date:'short'}}</p>
    <p><strong>{{'inventory.customId'| translate}}:</strong> {{inventory()?.idFormat}}</p>
    <p><strong>{{'inventory.description'| translate}}:</strong></p>
    <div class="description-wrapper">
      <markdown [data]="inventory()?.description"></markdown>
    </div>
  
    <div class="details-btns">
      <button mat-raised-button color="primary" (click)="edit()">
        <mat-icon>edit</mat-icon>
        {{'buttons.edit'| translate}}
      </button>
    </div>
  </div>
</div>
