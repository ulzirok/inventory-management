<h2 mat-dialog-title class="title">{{'salesforce.fill' | translate}}</h2>

<mat-dialog-content class="create-content">
  <form [formGroup]="form" class="create-form" (ngSubmit)="send()">

    <mat-form-field appearance="outline">
      <mat-label>{{'salesforce.company' | translate}}</mat-label>
      <input matInput type="string" formControlName="companyName">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{'salesforce.name' | translate}}</mat-label>
      <input matInput type="string" formControlName="name">
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>{{'salesforce.email' | translate}}</mat-label>
      <input matInput type="string" formControlName="email">
    </mat-form-field>

    <mat-dialog-actions>
      <button mat-button (click)="close()" type="button">{{'buttons.cancel' | translate}}</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">{{'buttons.send' |
        translate}}</button>
    </mat-dialog-actions>
  </form>
</mat-dialog-content>
