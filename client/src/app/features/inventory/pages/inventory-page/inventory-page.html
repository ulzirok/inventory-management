@if (isLoading()) {
<app-loader></app-loader>
} @else {
<div class="inventory-container">
  <h2 class="title">{{'inventory.inventoriesList'| translate}}</h2>

  <div class="inventories">
    <div class="inventory-top">
      <h3 class="subtitle">{{ 'inventory.inventoriesMy' | translate }}</h3>
      @if (canManage()) {
      <div class="sync">
        <button mat-raised-button color="primary" [disabled]="currentUser()?.salesforceId"
          (click)="syncToSalesforce()">
          {{ (currentUser()?.salesforceId ? 'buttons.synchronized' : 'buttons.sync')|translate}}
        </button>
      </div>
      }
    </div>
    <app-inventory-list [inventories]="inventories()" [isEditable]="true" [showViewItems]="false" [showChat]="false"
      (createInventory)="onCreateInventory()" (settingsInventory)="onSettingsInventory($event)"
      (deleteInventory)="onDeleteInventory($event)" [totalCount]="myTotal()"
      (paramsChange)="onMyParamsChange($event)"></app-inventory-list>

    <h3 class="subtitle">{{ 'inventory.inventoriesShared' | translate }}</h3>
    <app-inventory-list [inventories]="sharedInventories()" [isEditable]="false" [showViewItems]="true"
      [showChat]="true" (viewItems)="onviewItems($event)" (viewChats)="onviewChats($event)"
      (createInventory)="onCreateInventory()" (settingsInventory)="onSettingsInventory($event)"
      (deleteInventory)="onDeleteInventory($event)" [totalCount]="sharedTotal()"
      (paramsChange)="onSharedParamsChange($event)"></app-inventory-list>
  </div>
</div>
}
