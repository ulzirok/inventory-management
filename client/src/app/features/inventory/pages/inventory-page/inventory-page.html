@if (isLoading()) {
  <app-loader></app-loader>
} @else {
  <div class="inventory-container">
    <h2 class="title">{{'inventory.inventoriesList'| translate}}</h2>
    <app-inventory-list [inventories]="inventories()" [isEditable]="true" [showViewItems]="false"
      (createInventory)="onCreateInventory()" (settingsInventory)="onSettingsInventory($event)"
      (deleteInventory)="onDeleteInventory($event)"></app-inventory-list>
  </div>
}
