<div class="items-container">
  <app-items-list 
    [inventory]="inventory()!" [items]="items()" 
    [isEditable]="true" 
    (createItem)="onCreateItem($event)"
    (editItem)="onEditItem($event)" 
    (deleteItem)="onDeleteItem($event)"
    (viewItemDetails)="onViewItemDetails($event)"
    >
  </app-items-list>
</div>
