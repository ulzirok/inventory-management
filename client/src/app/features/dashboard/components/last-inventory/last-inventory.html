<mat-card>
  <mat-card-title class="title">{{'dashboard.lastInventories' | translate}}</mat-card-title>

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z1">

      <ng-container matColumnDef="inventory">
        <th mat-header-cell *matHeaderCellDef>{{ 'dashboard.inventory' | translate }}</th>
        <td mat-cell *matCellDef="let element"> {{element.inventory}} </td>
      </ng-container>

      <ng-container matColumnDef="item">
        <th mat-header-cell *matHeaderCellDef>{{ 'dashboard.items' | translate }}</th>
        <td mat-cell *matCellDef="let element"> {{element.items}} </td>
      </ng-container>

      <ng-container matColumnDef="author">
        <th mat-header-cell *matHeaderCellDef> {{ 'dashboard.author' | translate }} </th>
        <td mat-cell *matCellDef="let element"> {{element.author}} </td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>{{ 'dashboard.date' | translate }} </th>
        <td mat-cell *matCellDef="let element"> {{element.date | date:'short'}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-card>
