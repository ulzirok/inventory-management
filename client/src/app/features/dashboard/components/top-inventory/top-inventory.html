<mat-card>
  <mat-card-title class="title">{{'dashboard.topInventories' | translate}}</mat-card-title>

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z1">

      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef> {{'dashboard.title' | translate}} </th>
        <td mat-cell *matCellDef="let element"> {{element.title}} </td>
      </ng-container>
      
      <ng-container matColumnDef="items">
        <th mat-header-cell *matHeaderCellDef> {{'dashboard.items' | translate}} </th>
        <td mat-cell *matCellDef="let element"> {{element._count?.items ?? 0}} </td>
      </ng-container>

      <ng-container matColumnDef="owner">
        <th mat-header-cell *matHeaderCellDef> {{'dashboard.owner' | translate}} </th>
        <td mat-cell *matCellDef="let element"> {{element.author?.email || ''}} </td>
      </ng-container>
      
      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef> {{ 'inventory.image' | translate }} </th>
        <td mat-cell *matCellDef="let element">
          @if (element.imageUrl) {
            <img [src]="element.imageUrl" alt="{{element.title}}" width="50" height="50"
              style="object-fit: cover; border-radius: 4px;">
          }
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-card>
