<mat-card>
  <mat-card-title class="title">{{'dashboard.topInventories' | translate}}</mat-card-title>

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource()" class="mat-elevation-z1">

      <ng-container matColumnDef="inventory">
        <th mat-header-cell *matHeaderCellDef> {{'dashboard.inventory' | translate}} </th>
        <td mat-cell *matCellDef="let element"> {{element.inventory}} </td>
      </ng-container>
      
      <ng-container matColumnDef="items">
        <th mat-header-cell *matHeaderCellDef> {{'dashboard.items' | translate}} </th>
        <td mat-cell *matCellDef="let element"> {{element.items}} </td>
      </ng-container>

      <ng-container matColumnDef="owner">
        <th mat-header-cell *matHeaderCellDef> {{'dashboard.owner' | translate}} </th>
        <td mat-cell *matCellDef="let element"> {{element.owner}} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-card>
