<div class="dashboard-container">
  <div class="tables">
    <app-last-inventory [latestInventory]="latestInventory()"></app-last-inventory>
    <app-top-inventory [topInventory]="topInventory()"></app-top-inventory>
  </div>

  <div class="tags-section">
    <app-tags [tags]="tags()" (searchByTag)="onSearchByTag($event)">
    </app-tags>
  </div>
</div>

@if (isAuthenticated()) {
  <button mat-fab color="primary" class="fab">
    <mat-icon>add</mat-icon>
  </button>
}
