<mat-toolbar class="table-toolbar">
  <button mat-flat-button color="primary" (click)="changeStatus()" [disabled]="!hasSelection()">
    <mat-icon>lock</mat-icon>
    {{'buttons.block'| translate}}
  </button>

  <button mat-flat-button (click)="changeStatus()" [disabled]="!hasSelection()">
    <mat-icon>lock_open</mat-icon>
    {{'buttons.unBlock'| translate}}
  </button>

  <button mat-flat-button color="warn" (click)="deleteUsers()" [disabled]="!hasSelection()">
    <mat-icon>delete</mat-icon>
    {{'buttons.delete'| translate}}
  </button>
  
  <button mat-flat-button color="primary" (click)="changeRole()" [disabled]="!hasSelection()">
    <mat-icon>admin_panel_settings</mat-icon>
    {{'buttons.role'| translate}}
  </button>
  
  <button mat-flat-button color="primary" (click)="getUser()" [disabled]="!isSingleSelected()">
    <mat-icon>visibility</mat-icon>
    {{'buttons.user'| translate}}
  </button>
  
</mat-toolbar>

@if (dataSource().length > 0) {
<table mat-table [dataSource]="dataSource()">
  <ng-container matColumnDef="select">
    <th mat-header-cell *matHeaderCellDef>
      <mat-checkbox (change)="toggleAllRows()" [checked]="isAllSelected()"
        [indeterminate]="selection.hasValue() && !isAllSelected()">
      </mat-checkbox>
    </th>
    <td mat-cell *matCellDef="let row">
      <mat-checkbox (click)="$event.stopPropagation()" (change)="toggleRow(row)" [checked]="selection.isSelected(row)">
      </mat-checkbox>
    </td>
  </ng-container>

  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> {{'admin.name' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.name }} </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef> {{'admin.email' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.email }} </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef> {{'admin.status' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.isBlocked }} </td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef> {{'admin.role' | translate}} </th>
    <td mat-cell *matCellDef="let element"> {{ element.role }} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="toggleRow(row)"></tr>

</table>
}
