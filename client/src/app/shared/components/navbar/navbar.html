<mat-toolbar color="primary" class="navbar">
  <a mat-button class="logo" routerLink="/dashboard">
    <mat-icon>warehouse</mat-icon>
  </a>
  <span class="spacer"></span>
  
  <mat-form-field appearance="outline" class="search-field" subscriptSizing="dynamic" floatLabel="always">
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [formControl]="searchControl" placeholder="{{'search.placeholder' | translate}}..." />
  </mat-form-field>

  <a mat-button routerLink="/dashboard">{{ 'header.home' | translate }}</a>
  @if (isAuthenticated()) {
    <a mat-button routerLink="/inventory">{{ 'header.inventories' | translate }}</a>
  }
  @if (isAdmin()) {
    <a mat-button routerLink="/admin">{{ 'header.admin' | translate }}</a>
  }
  @if (!isAuthenticated()) {
    <a mat-button routerLink="/auth/login">{{ 'header.login' | translate }}</a>
  }
  @else {
    <button mat-button (click)="logout()">{{ 'header.logout' | translate }}</button>
  }

  <mat-select class="lang-switcher" [value]="currentLang()" (selectionChange)="changeLang($event.value)" disableRipple>
    <mat-option value="en">English</mat-option>
    <mat-option value="ru">Русский</mat-option>
  </mat-select>

  <button mat-icon-button (click)="toggleTheme()">
    @if (isDark()) {
      <mat-icon>light_mode</mat-icon>
    }
    @else {
      <mat-icon>dark_mode</mat-icon>
    }
  </button>

</mat-toolbar>
